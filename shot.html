<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>截图</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    cursor: crosshair; user-select: none; -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    touch-action: none;
  }
  #shot {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: fill; pointer-events: none; -webkit-user-drag: none;
  }
  #sel {
    position: fixed; display: none;
    border: 1px solid #38bdf8;
    box-shadow: 0 0 0 100vmax rgba(2, 6, 18, .55), 0 0 0 1px rgba(255,255,255,.22) inset;
    cursor: move;
  }
  #sel.show { display: block; }
  #sel .h {
    position: absolute; width: 11px; height: 11px;
    background: #fff; border: 2px solid #38bdf8; border-radius: 3px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
  }
  #sel .h[data-h="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
  #sel .h[data-h="n"]  { left: 50%; top: -6px; margin-left: -6px; cursor: ns-resize; }
  #sel .h[data-h="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
  #sel .h[data-h="e"]  { right: -6px; top: 50%; margin-top: -6px; cursor: ew-resize; }
  #sel .h[data-h="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
  #sel .h[data-h="s"]  { left: 50%; bottom: -6px; margin-left: -6px; cursor: ns-resize; }
  #sel .h[data-h="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
  #sel .h[data-h="w"]  { left: -6px; top: 50%; margin-top: -6px; cursor: ew-resize; }

  #toolbar {
    position: fixed; display: none; z-index: 20;
    align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
    background: rgba(10, 18, 32, .94);
    border: 1px solid rgba(56, 189, 248, .42);
    border-radius: 13px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .55), 0 0 24px rgba(56, 189, 248, .18);
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
  }
  #toolbar.show { display: flex; }
  #size {
    font-size: 12px; color: #8fa3c0; font-variant-numeric: tabular-nums;
    min-width: 76px; letter-spacing: .3px;
  }
  #toolbar button {
    height: 32px; padding: 0 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(120, 180, 255, .22);
    background: rgba(120, 180, 255, .08);
    color: #e6edf7; font-size: 12.5px; font-family: inherit;
    transition: background .15s, border-color .15s, transform .1s, filter .15s;
    white-space: nowrap;
  }
  #toolbar button:hover { background: rgba(120, 180, 255, .18); border-color: rgba(120, 180, 255, .42); }
  #toolbar button:active { transform: scale(.96); }
  #toolbar button.primary {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    border-color: rgba(56, 189, 248, .7); color: #fff; font-weight: 600;
    box-shadow: 0 4px 14px rgba(56, 189, 248, .32);
  }
  #toolbar button.primary:hover { filter: brightness(1.08); }
  #toolbar button.ghost { color: #cbd5e1; }
  #toolbar button:disabled { opacity: .55; cursor: default; transform: none; filter: none; }

  #tip {
    position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%);
    padding: 9px 18px; border-radius: 12px; z-index: 15;
    background: rgba(10, 18, 32, .88); border: 1px solid rgba(120, 180, 255, .22);
    color: #b8c7de; font-size: 13px; letter-spacing: .3px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    transition: opacity .4s ease;
    pointer-events: none;
  }
  #tip.hide { opacity: 0; }
  #tip b { color: #7dd3fc; font-weight: 600; }
  kbd {
    display: inline-block; padding: 1px 7px; margin: 0 2px;
    background: rgba(120, 180, 255, .13); border: 1px solid rgba(120, 180, 255, .22);
    border-radius: 5px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: #bae6fd;
  }
  #toast {
    position: fixed; left: 50%; top: 34px; transform: translateX(-50%);
    max-width: 80vw; padding: 10px 20px; border-radius: 11px; z-index: 30;
    background: rgba(10, 18, 32, .96); border: 1px solid rgba(56, 189, 248, .42);
    color: #e6edf7; font-size: 13px; text-align: center;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    word-break: break-all;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<img id="shot" alt="" draggable="false">
<div id="sel">
  <div class="h" data-h="nw"></div>
  <div class="h" data-h="n"></div>
  <div class="h" data-h="ne"></div>
  <div class="h" data-h="e"></div>
  <div class="h" data-h="se"></div>
  <div class="h" data-h="s"></div>
  <div class="h" data-h="sw"></div>
  <div class="h" data-h="w"></div>
</div>
<div id="toolbar">
  <span id="size">0 × 0</span>
  <button id="btnSave" class="primary">保存 PNG</button>
  <button id="btnCopy">复制</button>
  <button id="btnCancel" class="ghost">取消</button>
</div>
<div id="tip">拖动鼠标框选区域 · 拖动边角可调整大小 · <kbd>Enter</kbd> 复制 · <kbd>Esc</kbd> 取消</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  const T = window.__TAURI__;
  const invoke = (T && T.core && T.core.invoke) ? T.core.invoke.bind(T.core)
    : (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)
      ? window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__)
      : null;

  const img = document.getElementById('shot');
  const selEl = document.getElementById('sel');
  const toolbar = document.getElementById('toolbar');
  const sizeEl = document.getElementById('size');
  const tipEl = document.getElementById('tip');
  const toastEl = document.getElementById('toast');
  const btnSave = document.getElementById('btnSave');
  const btnCopy = document.getElementById('btnCopy');
  const btnCancel = document.getElementById('btnCancel');

  let sel = null;              // {x,y,w,h}  CSS px
  let drag = null;             // {mode, handle, sx, sy, rect}
  let busy = false;
  let toastTimer = 0;

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 1800);
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function applySel() {
    if (!sel || sel.w < 2 || sel.h < 2) {
      selEl.classList.remove('show');
      toolbar.classList.remove('show');
      return;
    }
    selEl.classList.add('show');
    selEl.style.left = sel.x + 'px';
    selEl.style.top = sel.y + 'px';
    selEl.style.width = sel.w + 'px';
    selEl.style.height = sel.h + 'px';

    const sc = scale();
    sizeEl.textContent = Math.round(sel.w * sc.sx) + ' × ' + Math.round(sel.h * sc.sy);
    toolbar.classList.add('show');
    const tw = toolbar.offsetWidth || 260;
    const th = toolbar.offsetHeight || 46;
    let left = clamp(sel.x + sel.w - tw, 8, window.innerWidth - tw - 8);
    let top = sel.y - th - 10;
    if (top < 8) top = Math.min(window.innerHeight - th - 8, sel.y + sel.h + 10);
    toolbar.style.left = left + 'px';
    toolbar.style.top = top + 'px';
  }

  function scale() {
    return {
      sx: (img.naturalWidth || 1) / Math.max(1, window.innerWidth),
      sy: (img.naturalHeight || 1) / Math.max(1, window.innerHeight)
    };
  }

  function close() {
    if (!invoke) { window.close(); return; }
    invoke('close_shot_window').catch(() => window.close());
  }

  function getCanvas() {
    const sc = scale();
    const x = clamp(Math.round(sel.x * sc.sx), 0, img.naturalWidth - 1);
    const y = clamp(Math.round(sel.y * sc.sy), 0, img.naturalHeight - 1);
    const w = clamp(Math.round(sel.w * sc.sx), 1, img.naturalWidth - x);
    const h = clamp(Math.round(sel.h * sc.sy), 1, img.naturalHeight - y);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
    return cv;
  }

  function b64FromU8(u8) {
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
      s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  async function doCopy() {
    if (busy) return;
    if (!sel || sel.w < 4 || sel.h < 4) { toast('请先框选一块区域'); return; }
    if (!invoke) { toast('当前环境不支持复制'); return; }
    busy = true; btnCopy.disabled = btnSave.disabled = true;
    try {
      const cv = getCanvas();
      const ctx = cv.getContext('2d');
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      const b64 = b64FromU8(new Uint8Array(data.buffer, data.byteOffset, data.byteLength));
      await invoke('copy_shot_rgba', { data: b64, width: cv.width, height: cv.height });
      toast('已复制到剪贴板', 900);
      setTimeout(close, 420);
    } catch (e) {
      toast('复制失败：' + (e && e.message ? e.message : e), 2600);
      busy = false; btnCopy.disabled = btnSave.disabled = false;
    }
  }

  async function doSave() {
    if (busy) return;
    if (!sel || sel.w < 4 || sel.h < 4) { toast('请先框选一块区域'); return; }
    if (!invoke) { toast('当前环境不支持保存'); return; }
    busy = true; btnCopy.disabled = btnSave.disabled = true;
    try {
      const cv = getCanvas();
      const dataUrl = cv.toDataURL('image/png');
      const b64 = dataUrl.split(',')[1];
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      const name = '截图_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
        '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.png';
      const saved = await invoke('save_shot_png', { data: b64, filename: name });
      toast('已保存：' + saved, 2600);
      setTimeout(close, 900);
    } catch (e) {
      toast('保存失败：' + (e && e.message ? e.message : e), 2600);
      busy = false; btnCopy.disabled = btnSave.disabled = false;
    }
  }

  function hitHandle(target) {
    return target && target.dataset && target.dataset.h ? target.dataset.h : null;
  }

  function insideSel(x, y) {
    return sel && x >= sel.x && x <= sel.x + sel.w && y >= sel.y && y <= sel.y + sel.h;
  }

  document.addEventListener('pointerdown', e => {
    if (busy) return;
    if (e.button !== 0) return;
    if (e.target.closest && e.target.closest('#toolbar')) return;
    e.preventDefault();

    const handle = hitHandle(e.target);
    const x = e.clientX, y = e.clientY;

    if (handle) {
      drag = { mode: 'resize', handle, sx: x, sy: y, rect: Object.assign({}, sel) };
      return;
    }
    if (insideSel(x, y)) {
      drag = { mode: 'move', sx: x, sy: y, rect: Object.assign({}, sel) };
      return;
    }
    sel = { x, y, w: 0, h: 0 };
    drag = { mode: 'new', sx: x, sy: y };
    applySel();
  });

  document.addEventListener('pointermove', e => {
    if (!drag) return;
    const x = e.clientX, y = e.clientY;

    if (drag.mode === 'new') {
      sel = {
        x: Math.min(drag.sx, x), y: Math.min(drag.sy, y),
        w: Math.abs(x - drag.sx), h: Math.abs(y - drag.sy)
      };
    } else if (drag.mode === 'move') {
      const r = drag.rect;
      const nx = clamp(r.x + (x - drag.sx), 0, window.innerWidth - r.w);
      const ny = clamp(r.y + (y - drag.sy), 0, window.innerHeight - r.h);
      sel = { x: nx, y: ny, w: r.w, h: r.h };
    } else if (drag.mode === 'resize') {
      const r = drag.rect;
      let l = r.x, t = r.y, rr = r.x + r.w, bb = r.y + r.h;
      const dx = x - drag.sx, dy = y - drag.sy;
      const h = drag.handle;
      if (h.indexOf('w') >= 0) l = clamp(r.x + dx, 0, rr - 4);
      if (h.indexOf('e') >= 0) rr = clamp(r.x + r.w + dx, l + 4, window.innerWidth);
      if (h.indexOf('n') >= 0) t = clamp(r.y + dy, 0, bb - 4);
      if (h.indexOf('s') >= 0) bb = clamp(r.y + r.h + dy, t + 4, window.innerHeight);
      sel = { x: l, y: t, w: rr - l, h: bb - t };
    }
    applySel();
  });

  const endDrag = () => {
    if (!drag) return;
    drag = null;
    if (sel && (sel.w < 4 || sel.h < 4)) {
      sel = null;
      selEl.classList.remove('show');
      toolbar.classList.remove('show');
    } else {
      applySel();
    }
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'Enter') { e.preventDefault(); doCopy(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); doSave(); }
  });

  document.addEventListener('contextmenu', e => e.preventDefault());

  btnSave.addEventListener('click', doSave);
  btnCopy.addEventListener('click', doCopy);
  btnCancel.addEventListener('click', close);

  window.addEventListener('blur', () => {});

  (async function init() {
    if (!invoke) { toast('截图窗口初始化失败：缺少 Tauri API', 5000); return; }
    try {
      const b64 = await invoke('get_shot_image');
      if (!b64) { toast('没有获取到屏幕截图', 4000); return; }
      img.src = 'data:image/png;base64,' + b64;
      if (img.decode) { try { await img.decode(); } catch (e) {} }
      setTimeout(() => tipEl.classList.add('hide'), 4200);
    } catch (e) {
      toast('加载截图失败：' + (e && e.message ? e.message : e), 5000);
    }
  })();
})();
</script>
</body>
</html>
